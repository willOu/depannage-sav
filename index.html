<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diag'SAV</title>
<meta name="theme-color" content="#9B2424">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diag'SAV">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --brand:#9B2424; --brand-2:#7a1b1b; --blue:#1f5fa8; --orange:#e07b00; --red:#c4161c;
  --bg:#f4f1ef; --card:#ffffff; --ink:#1d1a19; --muted:#6b6461; --line:#e3dcd8; --chip:#efe9e6;
  --c-er:#c4161c;--s-er:#c4161c;--s-sy:#c2610a;--s-af:#6b6461;--s-di:#2f6fb5;--s-te:#6d28d9;--t-alim:#c4161c; --t-no:#1f5fa8; --t-nf:#e07b00; --t-sortie:#4b5563; --t-moteur:#6d28d9; --t-bus:#0b7a75; --t-autre:#8a817d;
}
:root[data-theme="dark"]{
  --bg:#0f0e0e; --card:#1b1918; --ink:#f3eeeb; --muted:#a59d99; --line:#2e2a28; --chip:#262321;
  --s-er:#ff6a6a;--s-sy:#f0963a;--s-af:#a59d99;--s-di:#6aa6ec;--s-te:#a78bfa;--t-sortie:#9aa3af; --t-autre:#a59d99;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
header::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:100vh;background:var(--brand);pointer-events:none}
html{background:var(--bg)}
.top{display:flex;align-items:center;gap:10px}
.mark{display:grid;grid-template-columns:repeat(3,8px);gap:3px;align-content:center;background:none;border:0;padding:14px 10px;margin:-14px -10px;cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent}
.mark:active{background:rgba(255,255,255,.18)}
.mark i{width:8px;height:8px;display:block}
.mark i:nth-child(1){background:var(--blue)}.mark i:nth-child(2){background:var(--orange)}.mark i:nth-child(3){background:#ff4b4b}
.top h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:.2px}
.iconbtn{display:grid;place-items:center;background:rgba(255,255,255,.14);border:0;border-radius:10px;min-width:40px;height:40px;padding:0 10px;font-size:15px}
.back{background:none;border:0;color:#fff;font-size:15px;padding:6px 0;display:none}
.search{margin-top:10px;position:relative}
.search input{width:100%;height:46px;border:0;border-radius:12px;padding:0 14px 0 40px;font-size:16px;background:#fff;color:#1d1a19}
.search svg{position:absolute;left:12px;top:13px;opacity:.55}
.status{font-size:12.5px;opacity:.95;margin-top:6px;display:flex;align-items:flex-start;gap:7px;cursor:pointer;line-height:1.3}.status .sdot{width:9px;height:9px;border-radius:50%;background:#e07b00;flex:none;margin-top:4px}.status.ok .sdot{background:#5ee08a}
main{padding:14px 16px calc(env(safe-area-inset-bottom) + 30px);max-width:760px;margin:0 auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 2px 8px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;cursor:pointer;border-left:6px solid var(--c,var(--brand));min-height:78px}
.tile b{display:block;font-size:19px}
.tile span{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;width:100%}
.row b{font-size:17px}
.row small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;color:#fff;background:var(--c,var(--brand));margin-right:6px;vertical-align:2px}
.boardhead{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;border-left:6px solid var(--c)}
.boardhead h3{margin:0;font-size:22px}
.boardhead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.src{font-size:12.5px;color:var(--muted);margin-top:8px}
.hot{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.hot summary{cursor:pointer;font-weight:700;font-size:14.5px;list-style:none}
.hot summary::-webkit-details-marker{display:none}
.hot summary span{color:var(--muted);font-weight:500}
.hotl{display:grid;gap:2px;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit;text-decoration:none}
.hotl .mono{font:700 16px ui-monospace,Menlo,monospace;color:var(--brand)}
.hotl small{color:var(--muted);font-size:12px}
.hotn{color:var(--muted);font-size:12.5px;margin:8px 0 0}
.boardhead{position:relative}
.boardhead h3{padding-right:46px}
.favbtn{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.bchip.on{outline:2px solid var(--brand);outline-offset:1px}
.favbtn[aria-pressed="true"]{color:#e8a200;border-color:#e8a200}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:4px;margin:14px 0 10px;position:sticky;top:var(--hh,112px);z-index:3;background:var(--bg);padding:6px 0}
.tabs button{flex:1 0 auto;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;height:44px;font-weight:600;font-size:13px;padding:0 8px;white-space:nowrap}
.pfind{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px;padding:0 12px;margin:4px 0 6px}
.set{border:1px solid var(--line);border-radius:12px;background:var(--card);margin:6px 0;overflow:hidden}
.set .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;min-height:48px;border-top:1px solid var(--line)}
.set .row:first-child{border-top:0}
.set .row{border:0;border-top:1px solid var(--line);border-radius:0;background:none;width:auto;cursor:default}
.set .row:first-child{border-top:0}
.srow,.set details.grp,.secb{text-transform:none;letter-spacing:0}
.seg2{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg2 button{border:0;background:transparent;color:var(--ink);height:36px;padding:0 14px;font-weight:600;font-size:14px}
.seg2 button[aria-pressed="true"]{background:var(--brand);color:#fff}
.cl{padding:12px 14px;border-top:1px solid var(--line)}
.cl:first-child{border-top:0}
.cl .d{font-size:12px;color:var(--muted);font-weight:600}
.cl summary{cursor:pointer;list-style:none;font-size:14.5px;line-height:1.35;padding-right:18px;position:relative}
.cl summary::-webkit-details-marker{display:none}
.cl summary::after{content:"▸";position:absolute;right:0;top:0;color:var(--muted)}
.cl[open] summary::after{content:"▾"}
.cl summary .d{display:block;font-size:12px;color:var(--muted);font-weight:600}
.cl ul{margin-top:8px!important}
.cl ul{margin:0;padding-left:18px;font-size:14px;line-height:1.45}
.cl .docs{margin-top:8px;font-size:13px}
.doc{display:flex;gap:8px;align-items:flex-start;margin-top:4px}
.doc::before{content:"";flex:0 0 auto;width:14px;height:17px;margin-top:1px;border:2px solid var(--brand);border-radius:2px 6px 2px 2px}
.dk{padding:11px 14px;border-top:1px solid var(--line)}
.dk:first-child{border-top:0}
.dk .n{font-weight:600;font-size:14.5px}
.dk .s{font-size:13px;color:var(--muted);margin:2px 0 6px}
.dk .tb{display:flex;flex-wrap:wrap;gap:4px}
.dk .tb span{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.dk .tb span.ok{background:color-mix(in srgb,#2ea043 18%,transparent);color:#2ea043}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted)}
.prm{border:1px solid var(--line);border-radius:10px;background:var(--card);margin:6px 0;overflow:hidden}
.prm summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.prm summary::-webkit-details-marker{display:none}
.prm .pc{flex:0 0 auto;min-width:46px;text-align:center;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:15px;background:var(--brand);color:#fff;border-radius:6px;padding:3px 6px}
.prm .pt{flex:1;font-weight:600;font-size:14.5px;line-height:1.3}
.prm .pd{flex:0 0 auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.prm .pd b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--ink)}
.prm[open] summary{border-bottom:1px solid var(--line)}
.prm .pv{width:100%;border-collapse:collapse;margin:0}
.prm .pv td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
.prm .pv tr:first-child td{border-top:0}
.prm .pv td:first-child{font-family:ui-monospace,Menlo,monospace;font-weight:700;white-space:nowrap;width:1%}
.prm .pv td.w{font-family:inherit;font-size:13px}
.prm .pv tr.isdef td{background:color-mix(in srgb,var(--brand) 12%,transparent)}
.prm .pn{padding:8px 12px 10px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13.5px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.code{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start}
.code .k{font:700 18px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip);border-radius:8px;padding:7px 9px;min-width:64px;text-align:center;grid-row:span 2}
.code .t{font-weight:700;font-size:16px}
.code .a{color:var(--ink);opacity:.88;font-size:15px}
.code .p{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:4px}
.code .ctx{font-size:12.5px;color:var(--muted);grid-column:2}
.strip{display:flex;overflow-x:auto;gap:0;padding:4px 0 10px;scroll-snap-type:x proximity}
.term{flex:0 0 auto;width:92px;scroll-snap-align:start;border:2px solid var(--line);border-right-width:1px;background:var(--card);padding:0;cursor:pointer;text-align:center}
.term:first-child{border-radius:10px 0 0 10px}.term:last-child{border-radius:0 10px 10px 0;border-right-width:2px}
.term .screw{height:22px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.term .screw i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);position:relative}
.term .screw i:after{content:"";position:absolute;left:1px;right:1px;top:4px;height:2px;background:var(--muted)}
.term .n{font:700 14px/1.2 ui-monospace,Menlo,monospace;padding:6px 2px 2px}
.term .l{font-size:12px;padding:0 3px 6px;color:var(--muted);min-height:30px}
.term .bar{height:6px;background:var(--tc)}
.term[aria-pressed="true"]{outline:3px solid var(--brand);outline-offset:-3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--tc)}
.detail{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--tc,var(--brand));border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14.5px}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:break-word}
tr:first-child td{border-top:0}
td:first-child{font:700 14px ui-monospace,Menlo,monospace;white-space:normal;overflow-wrap:normal;word-break:normal;max-width:10em;border-left:5px solid var(--tc)}
.note{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
ol.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 52px;position:relative;font-size:15.5px}
ol.steps li:before{content:counter(s);position:absolute;left:12px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin:4px 0}
.gen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gen button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:600;text-align:center;cursor:pointer;min-height:118px}
.gen button svg{stroke:var(--ink);flex:0 0 auto}
.gen button small{font-size:12px;font-weight:400;color:var(--muted)}
.q{font-size:22px;font-weight:700;line-height:1.2;margin:6px 2px 12px}
.bchips{display:flex;flex-wrap:wrap;gap:8px}
.bchip{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 12px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:600;cursor:pointer}
.bchip i{width:12px;height:12px;border-radius:3px;display:block;background:var(--c)}
.bchip.logo{background:#fff;padding:6px 16px;border-color:var(--line)}
.bchip.logo img{display:block;height:28px;width:auto;max-width:120px;object-fit:contain}
.sec{font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:16px 2px 8px;display:flex;align-items:center;gap:8px;color:var(--sv)}
.sec i{width:10px;height:10px;border-radius:50%;background:var(--sv);display:block}
.sec span{color:var(--muted);font-weight:600}
.cr{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sv);border-radius:14px;overflow:hidden}
.cr summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;min-height:52px}
.cr summary::-webkit-details-marker{display:none}
.cr .pill{flex:0 0 auto;min-width:60px;text-align:center;font:700 15px ui-monospace,Menlo,monospace;padding:6px 9px;border-radius:8px;background:color-mix(in srgb,var(--sv) 20%,var(--card));color:var(--ink)}
.cr.er .pill{background:var(--c-er);color:#fff}
.cr .rt{flex:1;font-weight:600;font-size:15px;line-height:1.25}
.cr .chev{flex:0 0 auto;color:var(--muted);transition:transform .15s}
.cr[open] .chev{transform:rotate(90deg)}
.cr .todo{margin:0 12px 12px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.4}
.cr .todo b{display:block;font-size:12px;letter-spacing:.8px;color:var(--muted);margin-bottom:2px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:28px}
.sig{display:flex;align-items:center;justify-content:center;gap:8px;margin:28px 0 8px;color:var(--muted);font-size:12px}
.sig i{display:flex;gap:3px}.sig i b{width:8px;height:8px;border-radius:2px;display:block}
.qzh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
.qzbar{height:6px;border-radius:3px;background:var(--chip);margin:6px 0 10px;overflow:hidden}.qzbar i{display:block;height:100%;background:var(--brand)}
.qzc{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.qzo{display:grid;gap:8px;margin-top:10px}.qzo .row{font-size:15.5px}.qzo .row.mono{font-family:ui-monospace,monospace}
.qzo .row.bon{border-color:#2e9d57;background:color-mix(in srgb,#2e9d57 16%,var(--card))}
.qzo .row.faux{border-color:#E5372E;background:color-mix(in srgb,#E5372E 16%,var(--card))}
.qzo .row.off{opacity:.55}.qzo .row:disabled{cursor:default;color:var(--ink)}
.qzx small{color:var(--muted)}
.qzr{text-align:center;padding:18px 0 6px}.qzr .big{font-size:48px;font-weight:800}.qzr small{display:block;color:var(--muted);margin-top:4px}
.srow{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:15.5px;text-align:left;cursor:pointer}
.srow i{font-style:normal;color:var(--muted);font-size:20px;line-height:1}
.set .rr{display:flex;align-items:center;gap:10px}
details.grp{border-top:1px solid var(--line)}
.set>details.grp:first-child,.set>.srow:first-child{border-top:0}
details.grp>summary{display:block;text-transform:none;letter-spacing:0;color:var(--ink);list-style:none;cursor:pointer;padding:13px 34px 13px 14px;position:relative;font-size:15.5px;font-weight:600}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px;transition:transform .2s}
details.grp[open]>summary::after{transform:translateY(-50%) rotate(90deg)}
details.grp>summary small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.secb{padding:0 14px 12px}
.secb input,.secb textarea,.secb select{width:100%;box-sizing:border-box;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.secb select{width:auto;margin-left:6px}
.secb .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.secb.cls{padding:0}.secb.cls .cl{border-top:1px solid var(--line)}
#dks{padding:0}
.msgs{margin-bottom:6px}
.msg{background:var(--card);border:1px solid var(--line);border-left:5px solid #1F5FA8;border-radius:12px;padding:10px 12px;margin:8px 0}
.msg.al{border-left-color:#E5372E;background:color-mix(in srgb,#E5372E 10%,var(--card))}
.msg.lu{opacity:.85}
.msg .mh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.msg .mh span{font-size:12px;color:var(--muted);white-space:nowrap}
.msg p{margin:6px 0 0;font-size:14px;line-height:1.45}
.msg button{margin-top:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.mini{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer;flex:none}
.adm .row,.note .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note .row{padding:6px 0;border-top:1px solid var(--line)}
.note input,.note textarea,.note select{width:100%;box-sizing:border-box;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.note select{width:auto;margin-left:6px}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}.chk input[type=checkbox]{width:auto;margin:0}
.stt{width:100%}.stt td small{display:block;color:var(--muted);font-size:12px}.stt td.n{text-align:right;font-weight:700;width:56px}
.stseg{margin:4px 0 8px}
.cmpp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.cmpp label{font-size:12.5px;color:var(--muted);font-weight:600}
.cmpsel{display:block;width:100%;margin-top:4px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14.5px}

<body>
<div id="splash" aria-hidden="true"><div class="sq"><b style="background:#6FA8E8"></b><b style="background:#F5A33A"></b><b style="background:#FF6A5E"></b></div><h2>Diag'SAV</h2></div>
<header id="hdr">
  <div class="top">
    <button class="mark" id="home" title="Accueil" aria-label="Retour à l'accueil" onclick="$('#q').value='';go('#/')"><i></i><i></i><i></i></button>
    <h1 id="title">Diag'SAV</h1>
    <button class="iconbtn" id="theme" title="Mode sombre / clair" aria-label="Changer de thème">◐</button>
    <button class="iconbtn" id="gear" title="Réglages" aria-label="Réglages" onclick="toggleSettings()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <button class="back" id="back">‹ Retour</button>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Code, modèle, borne, symptôme…" aria-label="Rechercher">
  </div>
  <div class="status" id="status"></div>
</header>
<main id="app"></main>
<script src="diag.js"></script> <!-- DIAG -->
<script src="ask.js"></script> <!-- ASK -->
<script src="img.js"></script> <!-- SCH -->
<script src="acc.js"></script> <!-- ACC -->

<script src="data.js"></script>
<script src="auth.js"></script> <!-- AUTH -->
<script src="sync.js"></script> <!-- SYNC -->
<script src="cmp.js"></script> <!-- CMP -->
<script src="quiz.js"></script> <!-- QUIZ -->
<script src="sympt.js"></script> <!-- SYMPT -->
<script src="scan.js"></script> <!-- SCAN -->
<script>
const $ = s => document.querySelector(s);
const app = $("#app");
const TYPES = { afficheur:"Afficheur", flash:"Clignotant", led:"LED", diag:"Diagnostic", erreur:"Erreur", symptome:"Symptôme", test:"Mode TEST" };
const TERM = { alim:"Alimentation", no:"Commande NO", nf:"Sécurité / NF", sortie:"Sortie", moteur:"Moteur / usine", bus:"Bus", autre:"Autre" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* repère de borne : coupe seulement entre les mots (pas au tiret de « 48-49 ») */
const nw = t => String(t).split(" ").map(w => `<span style="white-space:nowrap">${esc(w)}</span>`).join(" ");
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[·\-_/]/g," ").replace(/\s+/g," ").trim();

/* index */
const BOARDS = [];
MARQUES.forEach(m => m.cartes.forEach(c => BOARDS.push({ m, c })));
const findBoard = id => BOARDS.find(b => b.c.id === id);

/* storage (optionnel) */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* thème : sombre par défaut (parkings) */
function applyTheme(t){ document.documentElement.dataset.theme = t; }
applyTheme(store.get("theme", "dark"));
function setTheme(t){ applyTheme(t); store.set("theme", t); if (location.hash === "#/reglages") viewSettings(); }
$("#theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

const APP_V = CHANGELOG[0].v;
const fdate = d => d.split("-").reverse().join("/");
/* statut réseau */
function status(){
  const e = $("#status"); if (!e || e.dataset.upd) return;
  e.innerHTML = `<i class="sdot"></i><span>${navigator.onLine ? "" : "Hors ligne · "}Version <b>${APP_V}</b> · données du <b>${fdate(DATA_VERSION)}</b> · <span id="offs">vérification du mode hors ligne…</span></span>`;
  e.onclick = () => go("#/reglages");
  offlineState();
}
addEventListener("online", status); addEventListener("offline", status); status();

/* hauteur header pour les onglets collants */
function hh(){ document.documentElement.style.setProperty("--hh", $("#hdr").offsetHeight + "px"); }
addEventListener("resize", hh);

/* ---------- vues ---------- */
const GENRES = [
  ["coulissant","Portail coulissant","Portails coulissants",`<svg width="64" height="44" viewBox="0 0 64 44" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 40h56M4 14v26M4 14h40v26"/><path d="M52 24h8M56 20l4 4-4 4" style="stroke:#e07b00"/></svg>`],
  ["battant","Portail battant","Portails battants",`<svg width="64" height="44" viewBox="0 0 64 44" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 40h56M6 6v34M58 6v34"/><path d="M6 12l22 4v22L6 38M58 12L36 16v22l22 0"/></svg>`],
  ["barriere","Barrière levante","Barrières levantes",`<svg width="64" height="44" viewBox="0 0 64 44" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 40h56M8 40V24h12v16"/><path d="M14 24L56 10" style="stroke:#c4161c"/><path d="M52 12v10" style="stroke:#c4161c"/></svg>`]
];
function genreOf(c){ const t = norm(c.type); return t.includes("coulissant") ? "coulissant" : t.includes("battant") ? "battant" : t.includes("barriere") ? "barriere" : "autre"; }
function viewHome(){
  setHead("Diag'SAV", false);
  const recents = store.get("recents", []).map(findBoard).filter(Boolean);
  const nb = g => BOARDS.filter(x => genreOf(x.c) === g).length;
  let h = (window.SYNC ? SYNC.accueilHtml() : "") + `<div class="q">Quel automatisme avez-vous devant vous ?</div><div class="gen">` + GENRES.filter(g => nb(g[0])).map(g =>
    `<button onclick="go('#/g/${g[0]}')">${g[3]}${g[1]}<small>${nb(g[0])} carte${nb(g[0])>1?"s":""}</small></button>`).join("") + `</div>`;
  h += `<button class="dbtn" onclick="go('#/d')">Diagnostic guidé : trouver la panne en quelques questions<small><b>EN TEST</b> · peut contenir des erreurs ou mal fonctionner</small></button>`; /* DIAG */
  h += `<button class="dbtn" onclick="go('#/a')">Accessoires : gyrophares, radio, photocellules…<small>${ACCESSOIRES.length} fiche${ACCESSOIRES.length>1?"s":""} par famille · rubrique en construction</small></button>`; /* ACC */
  h += `<button class="dbtn" onclick="go('#/quiz')">Quiz de formation : codes erreur et borniers<small><b>EN TEST</b> · 10 questions tirées des fiches</small></button>`; /* QUIZ */
  h += `<button class="dbtn" onclick="go('#/cmp')">Comparateur de borniers : remplacer une carte par une autre<small>bornes des deux cartes rangées par fonction · aide indicative</small></button>`; /* CMP */
  h += `<button class="dbtn" onclick="go('#/scan')">Scanner une étiquette : photographier la plaque de l'armoire<small><b>BÊTA</b> · lecture automatique du texte, peut se tromper</small></button>`; /* SCAN */
  h += `<h2>Ou par marque</h2><div class="bchips">` + MARQUES.map(m =>
    m.sanslogo ? `<button class="bchip" style="--c:${m.couleur}" onclick="go('#/m/${m.id}')"><i></i>${esc(m.nom)}</button>` : `<button class="bchip logo" aria-label="${esc(m.nom)}" onclick="go('#/m/${m.id}')"><img src="icons/marques/${m.id}.png" alt="${esc(m.nom)}" height="${({afca:52,casit:36,dea:40,elka:40,doitrand:32,opera:34})[m.id]||28}"></button>`).join("") + accBrandsOnly().map(b => b.logo ? `<button class="bchip logo" aria-label="${esc(b.nom)}" onclick="go('#/ma/${b.slug}')"><img src="icons/marques/${b.slug}.png" alt="${esc(b.nom)}" height="${b.slug==="opera"?34:28}"></button>` : `<button class="bchip" style="--c:${b.couleur}" onclick="go('#/ma/${b.slug}')"><i></i>${esc(b.nom)}</button>`).join("") + `</div>`;
  const favs = getFavs().map(x => findBoard(x) ? rowBoard(findBoard(x)) : (window.rowAccFav ? rowAccFav(x) : "")).filter(Boolean);
  h += `<h2>★ Mes favoris</h2>` + (favs.length ? `<div class="list">` + favs.join("") + `</div>` : `<p class="note">Aucun favori. Ouvrez une fiche (carte ou accessoire) et touchez l'étoile ★ pour la retrouver ici.</p>`) + `<p class="hotn">${esc(FAV_NOTE)}</p>`;
  if (recents.length){
    h += `<h2>Dernières consultées</h2><div class="list">` + recents.map(rowBoard).join("") + `</div>`;
  }
  h += `<p class="foot">Codes et borniers repris des notices fabricant citées sur chaque fiche.<br>En cas de doute, la notice livrée avec le matériel fait foi.</p>`;
  app.innerHTML = h;
}
function swAsk(msg){
  return new Promise(res => {
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller; if (!sw) return res(null);
    const ch = new MessageChannel(); ch.port1.onmessage = e => res(e.data); sw.postMessage(msg, [ch.port2]); setTimeout(() => res(null), 3000);
  });
}
async function offlineInfo(repair){
  if (!("serviceWorker" in navigator) || !window.caches) return { ok:false, txt:"mode hors ligne indisponible sur ce navigateur" };
  if (!navigator.serviceWorker.controller) return { ok:false, txt:"mode hors ligne en préparation : ouvrez l'appli une fois avec du réseau" };
  let r = await swAsk(repair ? "repair" : "check");
  if (!r) return { ok:true, txt:"mode hors ligne actif (vérification détaillée indisponible : rouvrez l'appli)" };
  if (r.missing && !repair && navigator.onLine){ await swAsk("repair"); r = await swAsk("check") || r; }
  if (!r.missing) return { ok:true, txt:`tout est téléchargé (${r.total} fichiers) : l'appli fonctionne sans réseau`, r };
  return { ok:false, txt:`incomplet : ${r.total - r.missing} fichiers sur ${r.total}. ${navigator.onLine ? "Réessayez dans un instant." : "Connectez-vous pour compléter."}`, r };
}
function offlineState(){
  const set = (ok, t) => { const e = $("#status"), s = $("#offs"); if (!e || !s) return; e.classList.toggle("ok", !!ok); s.textContent = (ok ? "✓ " : "⚠ ") + t; };
  offlineInfo(false).then(o => set(o.ok, o.txt)).catch(() => set(false, "mode hors ligne non vérifiable"));
  if ("serviceWorker" in navigator && !navigator.serviceWorker.controller && !offlineState.w){ offlineState.w = 1; navigator.serviceWorker.ready.then(() => setTimeout(() => { offlineState.w = 0; offlineState(); }, 1200)).catch(() => {}); }
}
function viewGenre(g){
  const G = GENRES.find(x => x[0] === g); if (!G) return viewHome();
  setHead(G[2], true);
  app.innerHTML = `<h2>${esc(G[2])}</h2><div class="list">` + BOARDS.filter(x => genreOf(x.c) === g).map(rowBoard).join("") + `</div>`;
}

function codeCard(x, ctx, q){
  const hl = s => q ? highlight(s, q) : esc(s);
  return `<div class="code"><div class="k">${hl(x.code)}</div><div class="t">${hl(x.titre)} <span class="p">${TYPES[x.type]||x.type}</span>${x.p?` <span class="p">contrôle de base</span>`:""}</div><div class="a">${hl(x.action)}</div>${ctx?`<div class="ctx">${ctx}</div>`:""}</div>`;
}
function highlight(s, q){
  const words = norm(q).split(" ").filter(w => w.length > 1);
  let out = esc(s);
  words.forEach(w => { const re = new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "ig"); out = out.replace(re, "<mark>$1</mark>"); });
  return out;
}


/* ---------- afficheur 7 segments ---------- */
const GC = { commande:"#1f6fd0", securite:"#e07b00", led:"#2ea043" };
const SEGS = {
  a:"10,2 50,2 56,8 50,14 10,14 4,8", d:"10,88 50,88 56,94 50,100 10,100 4,94", g:"10,45 50,45 56,51 50,57 10,57 4,51",
  f:"2,10 8,4 14,10 14,43 8,49 2,43", e:"2,59 8,53 14,59 14,92 8,98 2,92",
  b:"46,10 52,4 58,10 58,43 52,49 46,43", c:"46,59 52,53 58,59 58,92 52,98 46,92"
};
const SEGC = { a:[30,8], d:[30,94], g:[30,51], f:[8,26,1], e:[8,76,1], b:[52,26,1], c:[52,76,1] };
function drawScreen(e, rep, ei){
  const W = 84, H = 100;
  let svg = `<svg viewBox="-6 -4 ${e.digits.length*W + 6} ${H + 22}" role="img" aria-label="${esc(e.nom)}">`;
  e.digits.forEach((dg, i) => {
    const x = i*W;
    svg += `<g transform="translate(${x},0) skewX(-5)">`;
    Object.entries(SEGS).forEach(([k, pts]) => {
      const lab = dg.seg[k];
      if (lab){
        const r = rep[lab] || {g:"securite"};
        svg += `<polygon class="seg g-${r.g}" data-k="${esc(lab)}" points="${pts}"/>`;
        const [cx, cy, v] = SEGC[k];
        svg += `<text class="seglbl" x="${cx}" y="${cy}"${v?` transform="rotate(-90 ${cx} ${cy})"`:""}>${esc(lab)}</text>`;
      } else svg += `<polygon class="seg off" points="${pts}"/>`;
    });
    svg += `</g>`;
    if (dg.dp){
      const r = rep[dg.dp] || {g:"led"};
      svg += `<circle class="seg g-${r.g}" data-k="${esc(dg.dp)}" cx="${x+68}" cy="94" r="7"/><text class="dplbl" x="${x+68}" y="${H+16}">${esc(dg.dp)}</text>`;
    } else svg += `<circle class="seg off" cx="${x+68}" cy="94" r="7"/>`;
  });
  return svg + `</svg>`;
}

/* ---------- recherche ---------- */
function viewSearch(q){
  setHead("Recherche", true);
  const words = norm(q).split(" ").filter(Boolean);
  const match = txt => { const t = norm(txt); return words.every(w => t.includes(w)); };
  const codes = [], terms = [], boards = [], params = [];
  BOARDS.forEach(({m, c}) => {
    const ctx = `<span class="badge" style="--c:${m.couleur}">${esc(m.nom)}</span>${esc(c.nom)}`;
    const bt = norm(`${m.nom} ${m.alias || ""} ${c.nom} ${c.modeles} ${c.type} ${c.alias || ""}`), bc = bt.replace(/ /g, "");
    if (words.every(w => bt.includes(w) || bc.includes(w)) || bc.includes(norm(q).replace(/ /g, ""))) boards.push({m, c});
    c.codes.forEach(x => {
      const exact = norm(x.code) === norm(q);
      if (exact || match(`${m.nom} ${c.nom} ${x.code} ${x.titre} ${x.action}`)) codes.push({ x, ctx, exact, id: c.id });
    });
    (c.parametres ? c.parametres.groupes.flatMap(g => g.items) : []).forEach(x => {
      if (match(`${m.nom} ${c.nom} param parametre ${x.code} ${x.titre}`)) params.push({ x, ctx, id: c.id });
    });
    c.bornier.groupes.forEach(g => g.bornes.forEach(t => {
      if (match(`${m.nom} ${c.nom} ${t.n} ${t.label} ${t.desc}`)) terms.push({ t, ctx, id: c.id });
    }));
  });
  codes.sort((a, b) => b.exact - a.exact);
  let h = "";
  try { const al = window.accList ? accList(q) : ""; if (al) h += `<h2>Accessoires</h2><div class="list">${al}</div>`; } catch (e) {} /* ACC */
  try { if (window.askAnswer && words.length >= 2) h += askAnswer(q); } catch (e) {} /* ASK */
  try { /* SYMPT */
    const sl = window.symptList ? symptList(q, 6) : [];
    if (sl.length) h += `<h2>Pannes qui ressemblent</h2><p class="note">Recherche par symptôme : entrées des notices proches de votre phrase. Ce n'est pas un diagnostic, vérifiez sur la fiche.</p><div class="list">` + sl.map(r =>
      `<div onclick="go('#/c/${r.c.id}/codes')" style="cursor:pointer">${codeCard(r.x, `<span class="badge" style="--c:${r.m.couleur}">${esc(r.m.nom)}</span>${esc(r.c.nom)}`, q)}</div>`).join("") + `</div>`;
  } catch (e) {}
  if (boards.length) h += `<h2>Cartes</h2><div class="list">${boards.map(rowBoard).join("")}</div>`;
  if (codes.length) h += `<h2>Codes et signalisations (${codes.length})</h2><div class="list">` + codes.slice(0, 60).map(r =>
    `<div onclick="go('#/c/${r.id}/codes')" style="cursor:pointer">${codeCard(r.x, r.ctx, q)}</div>`).join("") + `</div>`;
  if (terms.length) h += `<h2>Bornes (${terms.length})</h2><table>` + terms.slice(0, 40).map(r =>
    `<tr style="--tc:var(--t-${r.t.t});cursor:pointer" onclick="go('#/c/${r.id}/bornier')"><td>${nw(r.t.n)}</td><td>${r.ctx}<br><b>${highlight(r.t.label,q)}</b> — ${highlight(r.t.desc,q)}</td></tr>`).join("") + `</table>`;
  if (params.length) h += `<h2>Paramètres (${params.length})</h2><table>` + params.slice(0, 40).map(r =>
    `<tr style="cursor:pointer" onclick="paramOpen=${esc(JSON.stringify(r.x.code))};go('#/c/${r.id}/param')"><td>${esc(r.x.code)}</td><td>${r.ctx}<br><b>${highlight(r.x.titre,q)}</b> · usine ${esc(r.x.def)}</td></tr>`).join("") + `</table>`;
  try { if (window.accDeep) h += accDeep(q); } catch (e) {} /* ACC */
  if (!h) h = `<div class="empty">Rien trouvé pour « ${esc(q)} ».<br>Essayez le code seul (ex. <b>E8</b>), un mot (ex. <b>encodeur</b>), la marque, ou décrivez la panne (ex. <b>le portail ne s'ouvre pas</b>).</div>`;
  app.innerHTML = h;
}

      <p class="hotn">${esc(FAV_NOTE)}</p>`;
  /* 4. Hors ligne et version */
  h += `<h2>Hors ligne et version</h2><div class="set"><div class="row"><span>Version de l'appli</span><span class="mono">v${APP_V}</span></div><div class="row"><span>Données</span><span class="mono">${fdate(DATA_VERSION)}</span></div>
      <div class="row"><span>Hors ligne</span><span class="mono" id="swv">…</span></div>
      <button class="srow" id="swb"><span>Vérifier / compléter le téléchargement</span><i>›</i></button></div>
      <p class="hotn" id="swd">Vérification du mode hors ligne…</p>`;
  /* 5. Administration (administrateurs seulement) */
  if (window.SYNC) h += SYNC.adminHtml(); /* SYNC */
  /* 6. Pour en savoir plus : repliés */
  h += `<h2>Informations</h2><div class="set">
    <details class="grp"><summary>🆕 Nouveautés <small>${CHANGELOG.length} versions · dernière v${esc(APP_V)}</small></summary><div class="secb cls">` + CHANGELOG.map(e => `<details class="cl"><summary><span class="d">v${esc(e.v)} · ${fdate(e.date)}</span> <b>${esc(e.titre)}</b></summary>
      <ul>${e.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
      ${e.docs && e.docs.length ? `<div class="docs"><b>Documentation ajoutée :</b>${e.docs.map(d => `<div class="doc">${esc(d)}</div>`).join("")}</div>` : ""}</details>`).join("") + `</div></details>
    <details class="grp"><summary>📚 Documentations intégrées <small>${BOARDS.length} cartes</small></summary><div class="secb" id="dks">` + BOARDS.map(({m, c}) => {
    const has = [["Codes", c.codes && c.codes.length], ["Bornier", c.bornier], ["Écran", c.afficheur], ["Paramètres", c.parametres], ["Apprentissage", c.apprentissage]];
    return `<div class="dk" onclick="go('#/c/${c.id}')" style="cursor:pointer"><div class="n"><span class="badge" style="--c:${m.couleur}">${esc(m.nom)}</span>${esc(c.nom)}</div>
      <div class="s">${esc(c.source)}</div><div class="tb">${has.map(([l, ok]) => `<span class="${ok?"ok":""}">${ok?"✓ ":""}${l}</span>`).join("")}</div></div>`;
  }).join("") + `</div></details></div>
      <p class="foot">En cas de doute, la notice livrée avec le matériel fait foi.</p>`;
  app.innerHTML = h;
  if (window.SYNC) SYNC.brancherReglages(); /* SYNC */
  const sv = $("#swv");
  if ("caches" in window) caches.keys().then(k => { sv.textContent = k.length ? k.sort().pop().replace("sav-", "") : "pas encore enregistré"; }).catch(() => sv.textContent = "—");
  else sv.textContent = "non pris en charge";
  const chk = rep_ => { $("#swd").textContent = "Vérification…"; offlineInfo(rep_).then(o => { $("#swd").textContent = (o.ok ? "✓ " : "⚠ ") + o.txt; status(); }); };
  $("#swb").onclick = () => chk(true); chk(false);
}

/* ---------- navigation ---------- */
function setHead(t, back){ $("#title").textContent = t; $("#back").style.display = back ? "block" : "none"; hh(); }
function go(hash){ location.hash = hash; }
let beforeSettings = "#/";
function toggleSettings(){
  if (location.hash === "#/reglages") go(beforeSettings || "#/");
  else { beforeSettings = location.hash || "#/"; go("#/reglages"); }
}
$("#back").onclick = () => { if (history.length > 1) history.back(); else go("#/"); };
let qTimer;
$("#q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { const v = e.target.value.trim(); go(v ? "#/s/" + encodeURIComponent(v) : "#/"); }, 180);
});
let prevRoute = [];
function route(){
  const p = location.hash.replace(/^#\/?/, "").split("/");
  if (window.AUTH_ACTIF) FAV_NOTE = "Vos favoris suivent votre compte : vous les retrouvez sur tous vos appareils (mise à jour dès qu'il y a du réseau).";
  if (window.SYNC){ /* SYNC : consultations */
    if ((p[0] === "c" || p[0] === "a") && p[1]){
      if (prevRoute[0] === "s" && prevRoute[1]) SYNC.vue("recherche", decodeURIComponent(prevRoute.slice(1).join("/")).trim().slice(0, 120));
      SYNC.vue(p[0] === "c" ? "carte" : "accessoire", p[1], p[2]);
    } else if (p[0] !== "s") SYNC.vue("", "");
  }
  prevRoute = p;
  window.scrollTo(0, 0);
  if (p[0] === "m") return viewBrand(p[1]);
  if (p[0] === "g") return viewGenre(p[1]);
  if (p[0] === "c"){ viewBoard(p[1], p[2]); app.insertAdjacentHTML("beforeend", `<div class="sig"><i><b style="background:#1F5FA8"></b><b style="background:#E07B00"></b><b style="background:#E5372E"></b></i>Diag'SAV</div>`); return; } /* SIG */
  if (p[0] === "ma") return viewAccBrand(p[1]);
  if (p[0] === "a") return p[1] ? viewAcc(p[1], p[2]) : viewAccList(); /* ACC */
  if (p[0] === "d") return viewDiag(p[1], p[2]); /* DIAG */
  if (p[0] === "scan") return viewScan(); /* SCAN */
  if (p[0] === "quiz") return viewQuiz(p[1]); /* QUIZ */
  if (p[0] === "cmp") return viewCmp(p[1] && p[1] !== "-" ? decodeURIComponent(p[1]) : "", p[2] ? decodeURIComponent(p[2]) : ""); /* CMP */
  if (p[0] === "stats") return SYNC.viewStats(p[1]); /* SYNC */
  if (p[0] === "reglages") return viewSettings();
  if (p[0] === "s"){ const q = decodeURIComponent(p.slice(1).join("/")); if ($("#q").value !== q) $("#q").value = q; return viewSearch(q); }
  $("#q").value = "";
  viewHome();
}
addEventListener("hashchange", route);
/* écran de démarrage : une fois par ouverture de l'appli */
(function(){ const sp = document.getElementById("splash"); if (!sp) return; let seen = false; try { seen = sessionStorage.getItem("splash") === "1"; sessionStorage.setItem("splash", "1"); } catch (e) {}
  if (seen) return sp.remove(); setTimeout(() => { sp.classList.add("off"); setTimeout(() => sp.remove(), 950); }, 1800); })();
AUTH.start(route); /* AUTH */

/* ---------- hors ligne ---------- */
if ("serviceWorker" in navigator){
  addEventListener("load", () => {
    const hadCtrl = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadCtrl && !reloaded){ reloaded = true; location.reload(); } });
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
      reg.addEventListener("updatefound", () => {
        const w = reg.installing;
        w && w.addEventListener("statechange", () => {
          if (w.state === "installed" && navigator.serviceWorker.controller){
            $("#status").dataset.upd = "1"; $("#status").innerHTML = `Nouvelle version disponible — <a href="#" onclick="location.reload();return false" style="color:#fff;font-weight:700">recharger</a>`;
          }
        });
      });
    }).catch(() => {});
  });
}
</script>
</body>
